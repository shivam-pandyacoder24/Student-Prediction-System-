name: Run analysis and execute notebook

on:
  push:
    branches: [main]
    paths:
      - 'src/model.py'
      - 'notebooks/student_performance_analysis.ipynb'
      - 'data/student_performance_dataset.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minor-project-artifacts
  cancel-in-progress: false

jobs:
  execute-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the full analysis
        run: python src/model.py
      - name: Execute the Jupyter notebook
        run: jupyter execute notebooks/student_performance_analysis.ipynb --inplace --ExecutePreprocessor.timeout=300
      - name: Prepare visual evidence
        run: |
          mkdir -p screenshots
          cp outputs/visualizations/*.png screenshots/
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ notebooks/student_performance_analysis.ipynb screenshots/
          if git diff --cached --quiet; then
            echo "Analysis outputs are already up to date."
          else
            git commit -m "Save executed analysis, predictions and visual evidence"
            git pull --rebase origin main
            git push
          fi

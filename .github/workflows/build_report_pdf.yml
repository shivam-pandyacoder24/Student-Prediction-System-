name: Build project report PDF

on:
  push:
    branches: [main]
    paths:
      - 'Project_Report.md'
      - 'scripts/build_report_pdf.py'
      - '.github/workflows/build_report_pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install report dependencies
        run: python -m pip install --upgrade pip reportlab svglib
      - name: Generate PDF report
        run: python scripts/build_report_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project_Report.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
          else
            git commit -m "Generate project report PDF"
            git pull --rebase origin main
            git push
          fi
